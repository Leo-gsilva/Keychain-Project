server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # até 100 MB por envio (mesmo limite do Spring para anexos)
    client_max_body_size 100M;

    # API: o navegador chama /api/... e o nginx repassa para o container do backend
    # (mesma origem do front, então não depende de CORS nem da porta 5432 aberta)
    location /api/ {
        proxy_pass http://backend:5432/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # env.js é gerado na subida do container: nunca deixar o navegador cachear
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # SPA do Angular: qualquer rota desconhecida cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
