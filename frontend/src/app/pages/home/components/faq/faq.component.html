<section id="duvidas" class="section faq">
  <div class="container faq__content">
    <div class="faq__intro" appReveal>
      <span class="section-label">Dúvidas frequentes</span>
      <h2 class="section-title">Antes de chamar, vale saber.</h2>
      <p class="text-body">Informação clara para você decidir com tranquilidade.</p>
    </div>

    <ul class="faq__list">
      @for (item of perguntas; track item.pergunta; let i = $index) {
        <li class="faq__item" [appReveal]="i * 80">
          <button
            type="button"
            class="faq__question"
            [attr.aria-expanded]="aberta() === i"
            [attr.aria-controls]="'faq-resposta-' + i"
            (click)="alternar(i)"
          >
            {{ item.pergunta }}
            <img [src]="aberta() === i ? 'assets/icons/minus.svg' : 'assets/icons/plus.svg'" alt="" />
          </button>
          @if (aberta() === i) {
            <p class="faq__answer" [id]="'faq-resposta-' + i">{{ item.resposta }}</p>
          }
        </li>
      }
    </ul>
  </div>
</section>
