<section class="section security">
  <div class="container security__content">
    <figure class="security__media" appReveal>
      <img
        src="assets/images/mecanismo-seguranca.jpg"
        alt="Cilindro de fechadura dourado com a chave encaixada sobre a bancada"
        loading="lazy"
      />
      <figcaption class="security__badge">
        <img src="assets/icons/shield-check.svg" alt="" />
        Seu acesso merece cuidado.
      </figcaption>
    </figure>

    <div class="security__text">
      <span class="section-label" [appReveal]="100">Confiança também é procedimento</span>
      <h2 class="section-title" [appReveal]="150">Abrir uma porta é uma responsabilidade.</h2>

      <ul class="security__list">
        @for (compromisso of compromissos; track compromisso.titulo; let i = $index) {
          <li [appReveal]="200 + i * 100">
            <img src="assets/icons/check.svg" alt="" />
            <span>
              <strong>{{ compromisso.titulo }}</strong>
              <span>{{ compromisso.descricao }}</span>
            </span>
          </li>
        }
      </ul>
    </div>
  </div>
</section>
