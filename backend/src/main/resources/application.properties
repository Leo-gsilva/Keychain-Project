spring.application.name=backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=5432

# Lê o .env tanto rodando de dentro de backend/ quanto da raiz do projeto
spring.config.import=optional:file:.env[.properties],optional:file:./backend/.env[.properties]
# 1. Limite Máximo: Impede que a API abra mais de 2 conexões (deixa espaço para o DBeaver/outros devs)
spring.datasource.hikari.maximum-pool-size=2

# 2. Mínimo Ocioso: Se a API não estiver sendo usada, mantém apenas 1 conexão aberta (economiza espaço no banco)
spring.datasource.hikari.minimum-idle=1

# 3. Timeout de Conexão: Se as 2 conexões estiverem em uso, espera até 20 segundos antes de dar erro (20000 ms)
spring.datasource.hikari.connection-timeout=20000

# 4. Timeout de Ociosidade: Fecha conexões que ficaram paradas por 10 segundos sem fazer nada (10000 ms)
spring.datasource.hikari.idle-timeout=10000

# 5. Tempo de Vida Máximo: Destrói e recria conexões a cada 5 minutos para evitar "conexões zumbis" presas na nuvem (300000 ms)
spring.datasource.hikari.max-lifetime=300000


# Swagger: ordena seções e rotas, deixa tudo recolhido e mantém o token ao recarregar
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.try-it-out-enabled=true

# Anexos de serviço: até 20 MB por arquivo e 100 MB por envio (o padrão do Spring é só 1 MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# Nunca devolve o stack trace do Java no JSON de erro (o devtools liga isso por padrão)
# As mensagens de validação continuam aparecendo pro front
server.error.include-stacktrace=never
# Sempre manda a mensagem do erro no JSON (ex.: "File type not allowed"), mesmo sem o devtools
server.error.include-message=always
